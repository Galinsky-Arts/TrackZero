name: Browser qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  accessible-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --prefix tools/browser-qualification
      - run: node tools/browser-qualification/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/browser-qualification.mjs
