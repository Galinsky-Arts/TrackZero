name: Planning CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Galinsky-Arts/Distributed-Radio-Engine
          ref: aabd242f31da59658d75dc61f3bb85c1d7d79d5b
          path: .deps/radio
          persist-credentials: false
      - run: node scripts/check-roadmap.mjs
      - run: node scripts/validate-pr-registry.mjs
      - run: node --test registry/pr-contract.test.mjs tests/*.test.mjs
        env:
          DRE_PLAYBACK_MODULE: ${{ github.workspace }}/.deps/radio/src/radio-playback.mjs
