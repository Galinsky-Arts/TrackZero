name: Planning CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Galinsky-Arts/Distributed-Radio-Engine
          ref: 98dad5e1027c8c6a14c94aa720c441064ee1b4d1
          path: .deps/radio
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Galinsky-Arts/Distributed-Audio-Engine
          ref: feaf485beb25f25ce222b3bc7a57c09392cc57a6
          path: .deps/audio-core
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: .deps/audio-core
      - run: npm run build
        working-directory: .deps/audio-core
      - run: node scripts/check-roadmap.mjs
      - run: node scripts/validate-pr-registry.mjs
      - run: node --test registry/pr-contract.test.mjs tests/*.test.mjs
        env:
          AUDIO_ENGINE_MODULE: ${{ github.workspace }}/.deps/audio-core/dist/src/index.js
          DRE_PLAYBACK_MODULE: ${{ github.workspace }}/.deps/radio/src/radio-playback.mjs
