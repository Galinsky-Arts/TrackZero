name: Planning CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: trackzero_ci
          POSTGRES_PASSWORD: trackzero_ci_only
          POSTGRES_DB: trackzero_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trackzero_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      # Fetches, verifies, builds and packs the engine commits in dependency-pins.json.
      - run: node scripts/prepare-deps.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: node scripts/check-roadmap.mjs
      - run: node scripts/validate-pr-registry.mjs
      - run: python3 scripts/validate_e2eesa_status.py
      - run: python3 scripts/check-current-secrets.py
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/run-tests.mjs
        env:
          TZ_TEST_DATABASE_URL: postgres://trackzero_ci:trackzero_ci_only@127.0.0.1:5432/trackzero_ci
          TZ_REQUIRE_FULL_SUITE: '1'
